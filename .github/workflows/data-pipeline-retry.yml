name: Data pipeline retry

on:
  workflow_run:
    workflows: [Data pipeline]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Retry failed data pipeline
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 4 }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait before retry
        run: |
          case "${{ github.event.workflow_run.run_attempt }}" in
            1) delay=300 ;;
            2) delay=1800 ;;
            3) delay=7200 ;;
            *) exit 0 ;;
          esac
          echo "Waiting ${delay} seconds before retrying data pipeline."
          sleep "$delay"

      - name: Rerun failed pipeline jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run rerun "$RUN_ID" --failed