name: Data pipeline

on:
  # Run monthly to refresh the raw OSM snapshot and rebuild the dataset.
  schedule:
    - cron: "0 3 1 * *"  # First day of each month, 03:00 UTC

  # Trigger manually when source data is known to have updated
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options: [production, development]

  push:
    branches: [main]
    paths:
      - 'scripts/src/**'
      - 'packages/data-model/**'


env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  AWS_REGION: eu-north-1

jobs:
  run-pipeline:
    name: Generate and upload dataset
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Osmium
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Download Geofabrik extract
        run: curl --fail --location --retry 3 --output finland-latest.osm.pbf https://download.geofabrik.de/europe/finland-latest.osm.pbf

      - name: Extract metropolitan OSM objects
        run: |
          osmium extract -b 24.45,60.05,25.35,60.42 finland-latest.osm.pbf -o capital.pbf
          osmium tags-filter capital.pbf \
            nwr/amenity=school nwr/amenity=library \
            nwr/amenity=hospital nwr/amenity=clinic nwr/amenity=doctors nwr/amenity=pharmacy \
            nwr/public_transport=platform nwr/highway=bus_stop \
            nwr/shop=supermarket nwr/leisure=park nwr/leisure=nature_reserve \
            -o capital-poi.pbf
          mkdir -p data/raw
          osmium export capital-poi.pbf -o data/raw/osm-poi.geojson
          pnpm --filter @aluevaaka/scripts extract-osm-poi \
            "$GITHUB_WORKSPACE/data/raw/osm-poi.geojson" \
            "$GITHUB_WORKSPACE/data/raw/osm-poi.json"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume target account role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.environment == 'production' && format('arn:aws:iam::{0}:role/OrganizationAccountAccessRole', secrets.AWS_ACCOUNT_ID_PROD) || 'arn:aws:iam::385579115858:role/OrganizationAccountAccessRole' }}
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve data bucket from stack
        id: bucket
        run: |
          ENV="${{ inputs.environment || 'development' }}"
          STACK="Aluevaaka-$(echo ${ENV^})"
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?ExportName=='aluevaaka-${ENV}-data-bucket'].OutputValue" \
            --output text)
          echo "name=$BUCKET" >> "$GITHUB_OUTPUT"

      - name: Upload OSM snapshot to S3
        run: pnpm --filter @aluevaaka/scripts upload-poi-snapshot
        env:
          DATA_BUCKET: ${{ steps.bucket.outputs.name }}
          POI_SNAPSHOT_KEY: data/raw/osm-poi.json
          POI_SNAPSHOT_PATH: data/raw/osm-poi.json
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Run data pipeline
        run: |
          set -o pipefail
          pnpm --filter @aluevaaka/scripts pipeline 2>&1 | tee pipeline.log
        env:
          POI_SNAPSHOT_BUCKET: ${{ steps.bucket.outputs.name }}
          POI_SNAPSHOT_KEY: data/raw/osm-poi.json
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Verify generated dataset
        run: |
          test -f data/generated/municipalities.json
          test -f data/generated/metrics.json
          test -f data/generated/dataset-manifest.json

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dataset-pipeline-report-${{ github.run_id }}
          path: |
            pipeline.log
            data/generated/dataset-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload to S3
        run: pnpm --filter @aluevaaka/scripts upload
        env:
          DATA_BUCKET: ${{ steps.bucket.outputs.name }}
          DATA_PREFIX: data/generated

      - name: Publish dataset metadata
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('data/generated/dataset-manifest.json') as f:
              manifest = json.load(f)
          print(json.dumps(manifest, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('### Dataset refresh\n\n')
              f.write(f'- Version: `{manifest["version"]}`\n')
              f.write(f'- Areas: `{manifest.get("areaCount", manifest["municipalityCount"])}`\n')
              f.write(f'- Generated: `{manifest["generatedAt"]}`\n')
              f.write(f'- Quality warnings: `{len(manifest.get("qualityWarnings", []))}`\n')
              for key, value in manifest.get('metricCoverage', {}).items():
                  f.write(f'- `{key}` coverage: `{value:.1%}`\n')
          PY

      - name: Save dataset as artifact
        uses: actions/upload-artifact@v6
        with:
          name: dataset-${{ github.run_id }}
          path: data/generated/
          retention-days: 14

      - name: Run smoke test to verify dataset is live
        run: |
          ENV="${{ inputs.environment || 'development' }}"
          STACK="Aluevaaka-$(echo ${ENV^})"
          URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?ExportName=='aluevaaka-${ENV}-function-url'].OutputValue" \
            --output text)

          # Give Lambda a moment to pick up the new dataset (cache invalidates on version change)
          sleep 5

            RESPONSE=$(curl --silent --show-error --fail-with-body --max-time 10 "${URL%/}/health")
          DATASET_STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('datasetStatus',''))")

          if [ "$DATASET_STATUS" != "available" ]; then
            echo "FAIL: dataset not available after upload"
            exit 1
          fi
          echo "PASS: dataset available"
