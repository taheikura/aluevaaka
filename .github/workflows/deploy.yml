name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: development
        type: choice
        options: [production, development]

concurrency:
  # Only one deploy per environment at a time
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9"
  AWS_REGION: eu-north-1

jobs:
  # ---------------------------------------------------------------------------
  # Merges to main deploy to development. Production is manual only.
  # ---------------------------------------------------------------------------
  setup:
    name: Resolve environment
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      aws_role_arn: ${{ steps.resolve.outputs.aws_role_arn }}
      aws_account_id: ${{ steps.resolve.outputs.aws_account_id }}
    steps:
      - id: resolve
        run: |
          ENV="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || 'development' }}"
          echo "env_name=$ENV" >> "$GITHUB_OUTPUT"
          if [ "$ENV" = "production" ]; then
            echo "aws_role_arn=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/OrganizationAccountAccessRole" >> "$GITHUB_OUTPUT"
            echo "aws_account_id=${{ secrets.AWS_ACCOUNT_ID_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "aws_role_arn=arn:aws:iam::385579115858:role/OrganizationAccountAccessRole" >> "$GITHUB_OUTPUT"
            echo "aws_account_id=385579115858" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build everything (same steps as CI but produces artifacts for deploy)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: |
          pnpm --filter @aluevaaka/data-model build
          pnpm --filter @aluevaaka/schemas build
          pnpm --filter @aluevaaka/scoring build

      - name: Build Lambda bundle
        run: pnpm --filter @aluevaaka/recommendation build
        env:
          SERVICE_VERSION: ${{ github.sha }}

      - name: Upload Lambda bundle
        uses: actions/upload-artifact@v6
        with:
          name: lambda-bundle-${{ github.sha }}
          path: services/recommendation/lambda.zip
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Generate or validate dataset
  # The pipeline runs on every deploy to catch stale data.
  # If this is too slow for frequent deploys, move to a scheduled workflow.
  # ---------------------------------------------------------------------------
  dataset:
    name: Generate dataset
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run data pipeline
        run: pnpm --filter @aluevaaka/scripts pipeline

      - name: Upload generated dataset
        uses: actions/upload-artifact@v6
        with:
          name: generated-data-${{ github.sha }}
          path: data/generated/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Deploy infrastructure with CDK
  # Only runs when infrastructure source files change, or on workflow_dispatch.
  # ---------------------------------------------------------------------------
  deploy-infra:
    name: Deploy infrastructure (CDK)
    needs: [setup, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env_name }}
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Inspect GitHub OIDC claims
        run: |
          TOKEN=$(curl --fail --silent \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOKEN="$TOKEN" python3 -c 'import base64,json,os; value=json.loads(os.environ["TOKEN"])["value"]; claims=json.loads(base64.urlsafe_b64decode(value.split(".")[1] + "=" * (-len(value.split(".")[1]) % 4))); print(json.dumps({k: claims.get(k) for k in ("iss", "aud", "sub")}, indent=2))'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: aluevaaka-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume target account role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.setup.outputs.aws_role_arn }}
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify target account
        id: target-account
        run: |
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          EXPECTED_ACCOUNT="${{ needs.setup.outputs.aws_account_id }}"
          echo "AWS caller account: $ACTUAL_ACCOUNT"
          echo "Expected target account: $EXPECTED_ACCOUNT"
          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "ERROR: AWS credentials are not for the selected target account"
            exit 1
          fi
          echo "account_id=$ACTUAL_ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Download Lambda bundle (CDK asset)
        uses: actions/download-artifact@v7
        with:
          name: lambda-bundle-${{ github.sha }}
          path: services/recommendation/

      - name: Unzip Lambda bundle to bundle/
        run: |
          mkdir -p services/recommendation/bundle
          unzip -o services/recommendation/lambda.zip -d services/recommendation/bundle

      - name: Build CDK
        run: pnpm --filter @aluevaaka/infrastructure build

      - name: CDK deploy
        run: |
          pnpm --filter @aluevaaka/infrastructure cdk deploy \
            --require-approval never \
            --context env=${{ needs.setup.outputs.env_name }} \
            --context alertEmail=${{ secrets.ALERT_EMAIL }}
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.target-account.outputs.account_id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}

  # ---------------------------------------------------------------------------
  # Deploy application (Lambda + frontend + data) — runs after infra
  # ---------------------------------------------------------------------------
  deploy-app:
    name: Deploy application
    needs: [setup, build, dataset, deploy-infra]
    runs-on: ubuntu-latest
    environment: ${{ needs.setup.outputs.env_name }}
    permissions:
      id-token: write
      contents: read
    outputs:
      function_url: ${{ steps.get-outputs.outputs.function_url }}
      distribution_id: ${{ steps.get-outputs.outputs.distribution_id }}
      web_bucket: ${{ steps.get-outputs.outputs.web_bucket }}
      data_bucket: ${{ steps.get-outputs.outputs.data_bucket }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume target account role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.setup.outputs.aws_role_arn }}
          role-chaining: true
          role-skip-session-tagging: true
          aws-region: ${{ env.AWS_REGION }}

      - name: Read CDK stack outputs
        id: get-outputs
        run: |
          ENV="${{ needs.setup.outputs.env_name }}"
          STACK="Aluevaaka-$(echo ${ENV^})"

          FUNCTION_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?ExportName=='aluevaaka-${ENV}-function-url'].OutputValue" \
            --output text)

          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?ExportName=='aluevaaka-${ENV}-distribution-id'].OutputValue" \
            --output text)

          WEB_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?ExportName=='aluevaaka-${ENV}-web-bucket'].OutputValue" \
            --output text)

          DATA_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?ExportName=='aluevaaka-${ENV}-data-bucket'].OutputValue" \
            --output text)

          echo "function_url=$FUNCTION_URL" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "web_bucket=$WEB_BUCKET" >> "$GITHUB_OUTPUT"
          echo "data_bucket=$DATA_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Build frontend with real API URL
        run: |
          pnpm --filter @aluevaaka/schemas build
          pnpm --filter @aluevaaka/web build
        env:
          VITE_API_URL: ${{ steps.get-outputs.outputs.function_url }}

      - name: Download Lambda bundle
        uses: actions/download-artifact@v7
        with:
          name: lambda-bundle-${{ github.sha }}
          path: services/recommendation/

      - name: Upload generated data to S3
        run: |
          DATA_DIR="data/generated"
          # Download the artifact produced by the dataset job
          echo "Uploading dataset to s3://${{ steps.get-outputs.outputs.data_bucket }}/data/generated/"
        # The actual upload uses the upload script which reads DATA_BUCKET env var
      - name: Download generated dataset artifact
        uses: actions/download-artifact@v7
        with:
          name: generated-data-${{ github.sha }}
          path: data/generated/

      - name: Upload dataset to S3
        run: pnpm --filter @aluevaaka/scripts upload
        env:
          DATA_BUCKET: ${{ steps.get-outputs.outputs.data_bucket }}
          DATA_PREFIX: data/generated
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Sync frontend to S3
        run: |
          aws s3 sync apps/web/dist/ \
            s3://${{ steps.get-outputs.outputs.web_bucket }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "assets/*"

          # Long-lived cache for hashed assets
          aws s3 sync apps/web/dist/assets/ \
            s3://${{ steps.get-outputs.outputs.web_bucket }}/assets/ \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name aluevaaka-recommendation-${{ needs.setup.outputs.env_name }} \
            --zip-file fileb://services/recommendation/lambda.zip \
            --architectures arm64

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name aluevaaka-recommendation-${{ needs.setup.outputs.env_name }}

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.get-outputs.outputs.distribution_id }} \
            --paths "/*"

  # ---------------------------------------------------------------------------
  # Smoke test after deploy
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Post-deploy smoke test
    needs: [setup, deploy-app]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/smoke-test.yml
    with:
      function_url: ${{ needs.deploy-app.outputs.function_url }}
      environment: ${{ needs.setup.outputs.env_name }}
