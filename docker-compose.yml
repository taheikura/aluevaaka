services:
  lambda:
    build:
      context: .
      dockerfile: docker/lambda/Dockerfile
    container_name: aluevaaka-lambda
    environment:
      DATA_BUCKET: local
      DATA_PREFIX: /var/data
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      SERVICE_VERSION: local
      NODE_OPTIONS: --enable-source-maps
      AWS_DEFAULT_REGION: eu-north-1
    volumes:
      - ./data/generated:/var/data:ro
    ports:
      - "9000:8080"

  api:
    build:
      context: .
      dockerfile: docker/local-api/Dockerfile
    container_name: aluevaaka-api
    depends_on:
      - lambda
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: aluevaaka-web
    ports:
      - "8080:80"
